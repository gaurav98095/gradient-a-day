<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A quiet daily journal for turning papers into durable understanding." />
    <title>Gradient a day — A learning newspaper</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="paper">
      <header class="masthead-tools date-only">
        <time id="edition-date"></time>
      </header>

      <section class="intro">
        <h1><button data-action="home">Gradient a day</button></h1>
        <p>A tiny learning newsletter · Curated by <a class="curator-link" href="https://www.linkedin.com/in/gaurav98095/" target="_blank" rel="noreferrer">Gaurav K</a></p>
      </section>

      <hr />

      <section class="filters" id="note-filters" aria-label="Note filters">
        <div class="filter-block">
          <span class="filter-label">Topic:</span>
          <div class="filter-menu" id="topic-pills" aria-label="Topics"></div>
        </div>
        <div class="filter-block">
          <span class="filter-label">Mode:</span>
          <div class="filter-menu" id="mode-pills" aria-label="Modes"></div>
        </div>
      </section>

      <section class="notes" id="notes" aria-live="polite"></section>

      <section class="empty-state" id="empty-state" hidden>
        <p>No notes here yet.</p>
      </section>

      <footer>
        <p class="inspiration-note">Inspired by <a href="https://tdd.cat/" target="_blank" rel="noreferrer">tdd.cat</a></p>
      </footer>
    </main>
    <script src="app.js"></script>
  </body>
</html>
